name: CI

# One job per pull request. A pull request runs `pnpm check:static`; a Mergify queue draft (head ref
# `mergify/merge-queue/*`) and a push to main run `pnpm check:ci`, the static checks plus the whole test suite.
# Mergify builds its drafts as pull requests, so there is no merge_group trigger. The squash-message lint
# and the change-intent check are steps of the same job. A newer push to a pull request cancels its older run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: systemfsoftware/systemfsoftware/.github/workflows/reusable-ci.yml@f271b208fd10c56d27380de6bc43f54b9c7ee2a5
    with:
      commitlint: true
      changeset: false
      fast: |
        s=0; ./bin/dprint check || s=1
        export TURBO_SCM_BASE="$BASE" TURBO_SCM_HEAD="$HEAD"
        pnpm exec turbo run --concurrency=${TURBO_CONCURRENCY:-50%} --continue build lint typecheck test:types api:check attw --affected || s=1
        exit $s
      full: pnpm check:ci
