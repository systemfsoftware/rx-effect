allowBuilds:
  "@parcel/watcher": false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  onnxruntime-node: false
  playwright: false
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false
catalog:
  typescript: ^7.0.2
  microsandbox: 0.7.8
  "@systemfsoftware/arethetypeswrong-cli": ^4.2.0
  "@effect/platform-node": ^4.1.2
  "@effect/platform-bun": 4.1.2
  "@effect/platform-node-shared": ^4.1.2
  effect: ^4.1.2
  "@effect/sql-pglite": ^4.1.2
  "@effect/tsgo": ^0.64.1
  "@effect/opentelemetry": ^4.1.2
  "@opentelemetry/sdk-trace-base": ^2.12.0
  "@opentelemetry/api": ^1.9.0
  "@opentelemetry/resources": ^2.12.0
  "@opentelemetry/semantic-conventions": ^1.43.0
  fast-check: ^4.10.2
  "@noble/hashes": ^2.4.0
  vitest: ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  "@vitest/coverage-istanbul": ^5.0.5
  vite: ^8.3.4
  tsdown: ^0.23.0
  rimraf: ^6.1.3
  "@types/node": ^26.6.5
  tstyche: ^7.2.5
  "@microsoft/api-extractor": ^7.59.4
  oxc-parser: ^0.153.0
  "@oxc-project/types": ^0.153.0
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/scheduler": ^0.28.0
  react: ^19.3.0
  react-dom: ^19.3.0
  react-error-boundary: ^6.1.6
  scheduler: ^0.28.0
  storybook: ^10.6.1
  type-fest: ^5.10.0
  "@storybook/addon-vitest": ^10.6.1
  "@storybook/react-vite": ^10.6.1
  "@vitest/browser": ^5.0.5
  "@vitest/browser-playwright": ^5.0.5
  playwright: ^1.64.0
  "@pnpm/logger": ^1100.0.0
  "@pnpm/workspace.projects-reader": ^1101.1.4
  "@pnpm/workspace.root-finder": ^1100.1.3
  "@pnpm/workspace.workspace-manifest-reader": ^1100.2.2
catalogMode: prefer
catalogs:
  peers:
    effect: ^4
  oxlint:
    oxlint: ~1.90.0
    "@oxlint/plugins": ~1.90.0
    oxlint-tsgolint: 7.0.2005
  stryker:
    "@systemfsoftware/stryker-ignorer-effect-schema-declarations": latest
    "@systemfsoftware/stryker-ignorer-in-source-vitest-block": latest
    "@systemfsoftware/stryker-js": latest
    "@systemfsoftware/stryker-js-typescript-checker": latest
    "@systemfsoftware/stryker-js-vitest-runner": latest
    "mutation-testing-elements": 3.9.0
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@systemfsoftware/*"
  - effect
  - "@effect/*"
overrides:
  # Keep the toolchain core locked (rolldown-plugin-dts@0.28.6 carries the patch).
  tsdown: 0.23.0
  rolldown-plugin-dts: 0.28.6
  "@systemfsoftware/conformance-spec@*": file:.deps/conformance-spec.tgz
  "@systemfsoftware/differential-spec@*": file:.deps/differential-spec.tgz
  "@systemfsoftware/effect-atom@*": file:.deps/effect-atom.tgz
  "@systemfsoftware/effect-atom-react@*": file:.deps/effect-atom-react.tgz
  "@systemfsoftware/effect-cell-types@*": file:.deps/effect-cell-types.tgz
  "@systemfsoftware/effect-gherkin-spec@*": file:.deps/effect-gherkin-spec.tgz
  "@systemfsoftware/effect-schema-discovery@*": file:.deps/effect-schema-discovery.tgz
  "@systemfsoftware/effect-schema-law@*": file:.deps/effect-schema-law.tgz
  "@systemfsoftware/effect-schema-recursion-budget@*": file:.deps/effect-schema-recursion-budget.tgz
  "@systemfsoftware/effect-schema-vite@*": file:.deps/effect-schema-vite.tgz
  "@systemfsoftware/effect-sim-kernel@*": file:.deps/effect-sim-kernel.tgz
  "@systemfsoftware/effect-spec-runtime@*": file:.deps/effect-spec-runtime.tgz
  "@systemfsoftware/omp-typescript-discipline@*": file:.deps/omp-typescript-discipline.tgz
  "@systemfsoftware/oxlint-config-cell-architecture@*": file:.deps/oxlint-config-cell-architecture.tgz
  "@systemfsoftware/oxlint-config-dmmf@*": file:.deps/oxlint-config-dmmf.tgz
  "@systemfsoftware/oxlint-config-recommended@*": file:.deps/oxlint-config-recommended.tgz
  "@systemfsoftware/oxlint-config-rule-authoring@*": file:.deps/oxlint-config-rule-authoring.tgz
  "@systemfsoftware/oxlint-plugin-cell-architecture@*": file:.deps/oxlint-plugin-cell-architecture.tgz
  "@systemfsoftware/oxlint-plugin-dmmf-workflow@*": file:.deps/oxlint-plugin-dmmf-workflow.tgz
  "@systemfsoftware/oxlint-plugin-effect-platform@*": file:.deps/oxlint-plugin-effect-platform.tgz
  "@systemfsoftware/oxlint-plugin-effect-schema@*": file:.deps/oxlint-plugin-effect-schema.tgz
  "@systemfsoftware/oxlint-plugin-test-discipline@*": file:.deps/oxlint-plugin-test-discipline.tgz
  "@systemfsoftware/storybook-gherkin@*": file:.deps/storybook-gherkin.tgz
  "@systemfsoftware/stryker-config@*": file:.deps/stryker-config.tgz
  "@systemfsoftware/trace-spec@*": file:.deps/trace-spec.tgz
  "@systemfsoftware/trace-taxonomy@*": file:.deps/trace-taxonomy.tgz
  "@systemfsoftware/tsconfig@*": file:.deps/tsconfig.tgz
  "@systemfsoftware/tsdown-config@*": file:.deps/tsdown-config.tgz
  "@systemfsoftware/vitest@*": file:.deps/vitest.tgz
  "@systemfsoftware/vitest-config@*": file:.deps/vitest-config.tgz
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/tsgo": "catalog:"
  fast-check: "catalog:"
  vite: "catalog:"
  # storybook's csf-plugin resolves esbuild 0.27 in its peer context while tsx
  # uses 0.28; the split forks vite and therefore vitest into two physical builds
  # per peer context. One esbuild keeps one vitest (issue #304 guard).
  esbuild: ^0.28.2
packages:
  - packages/*
patchedDependencies:
  rolldown-plugin-dts@0.28.6: patches/rolldown-plugin-dts@0.28.6.patch
supportedArchitectures:
  os: [linux]
  cpu: [x64, arm64]
  libc: [glibc]
